# info.yaml  
# Tiny Tapeout project information
project:
  author:       "David"      # Your name
  discord:      "davvdf"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "stuff"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  title: "ASIC Onboarding Project - Your Name"  
  author: "Your Name"  
  description: "SPI-controlled PWM peripheral for Tiny Tapeout."  
  top_module: "tt_um_uwasic_onboarding_david"  # Match your top module name  
  source_files:  
    - spi_peripheral.sv
    - pwm_peripheral.v  
    - project.v
    - sync.sv
    - edge_detector.sv

# NOT REQUIRED
pinout:
  # Inputs
  ui[0]: "SCLK"
  ui[1]: "COPI"
  ui[2]: "nCS"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  
  # Outputs
  uo[0]: "OUT_0"
  uo[1]: "OUT_1"
  uo[2]: "OUT_2"
  uo[3]: "OUT_3"
  uo[4]: "OUT_4"
  uo[5]: "OUT_5"
  uo[6]: "OUT_6"
  uo[7]: "OUT_7"
  
  # Bidirectional pins
  uio[0]: "OUT_8"
  uio[1]: "OUT_9"
  uio[2]: "OUT_A"
  uio[3]: "OUT_B"
  uio[4]: "OUT_C"
  uio[5]: "OUT_D"
  uio[6]: "OUT_E"
  uio[7]: "OUT_F"

